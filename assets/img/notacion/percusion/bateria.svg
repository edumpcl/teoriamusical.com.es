<svg id="yph0j2k" viewBox="0 0 344 80" width="526" height="122" role="img" xmlns="http://www.w3.org/2000/svg"><title>Un compás de 4/4 de batería en un pentagrama de cinco líneas con clave de percusión. Arriba, con cabeza en aspa y la plica hacia arriba, ocho corcheas del charles; abajo, con la plica hacia abajo, el bombo en el espacio inferior en el primer y el tercer tiempo, y la caja en el tercer espacio en el segundo y el cuarto tiempo.</title>
